<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectHub - Student Final Year Projects</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      color: #1a1a1a;
    }

    header {
      background-color: #1e3a5f;
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 22px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
    }

    .hero {
      text-align: center;
      padding: 80px 20px;
      background: linear-gradient(135deg, #1e3a5f, #2a5a8c);
      color: white;
    }

    .hero h2 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 16px;
      max-width: 500px;
      margin: 0 auto 30px auto;
      opacity: 0.9;
    }

    .btn {
      display: inline-block;
      padding: 12px 28px;
      margin: 8px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }

    .btn-primary {
      background-color: #ffffff;
      color: #1e3a5f;
    }

    .btn-secondary {
      background-color: transparent;
      color: white;
      border: 1px solid white;
    }

    .features {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 60px 20px;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 24px;
      width: 220px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin-bottom: 10px;
      font-size: 16px;
      color: #1e3a5f;
    }

    .card p {
      font-size: 13px;
      color: #555;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>

  <header>
    <h1>ProjectHub</h1>

      <a href="#">Sign In</a>
    </nav>
